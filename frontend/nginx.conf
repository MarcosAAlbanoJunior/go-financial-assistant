# Mesma origem para o front e a API: sem CORS, e o cookie de sessão nunca sai do domínio.

# Se houver outro proxy com HTTPS na frente, ele informa o esquema real em X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $http_host;
        # Sobrescritos (não anexados): o app usa estes valores para o rate limit e o atributo Secure do cookie.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Arquivos com hash no nome: podem ser cacheados para sempre.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rotas do React Router caem no index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
