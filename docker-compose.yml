services:
  postgres:
    image: postgres:16-alpine
    container_name: finassist-postgres
    environment:
      POSTGRES_USER: finassist
      POSTGRES_PASSWORD: finassist
      POSTGRES_DB: finassist
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finassist -d finassist"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backup diário do banco para ./backups (veja o README, seção "Backup e restauração").
  backup:
    image: postgres:16-alpine
    container_name: finassist-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Roda com o seu usuário do host (padrão 1000:1000) para os arquivos não ficarem presos ao root.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGPASSWORD: finassist
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  # Canal WhatsApp: só sobe com COMPOSE_PROFILES=whatsapp (ver .env.example).
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: finassist-evolution
    profiles: ["whatsapp"]
    ports:
      - "8082:8080"
    environment:
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1035712111"

      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}

      WEBHOOK_GLOBAL_URL: http://app:3000/webhook
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF: "true"
      WEBHOOK_BASE64: "true"
      GROUPS_IGNORE: "true"

      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "false"

      CONFIG_SESSION_PHONE_CLIENT: "FinAssist"
      CONFIG_SESSION_PHONE_NAME: "Chrome"

      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://finassist:finassist@postgres:5432/finassist?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    volumes:
      - evolution_data:/evolution/instances

  redis:
    image: redis:7-alpine
    container_name: finassist-redis
    profiles: ["whatsapp"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finassist-app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://finassist:finassist@postgres:5432/finassist?sslmode=disable
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PAID_PLAN: ${GEMINI_PAID_PLAN:-false}
      COACH_GEMINI_MODEL: ${COACH_GEMINI_MODEL:-}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-true}
      DIGEST_WEEKDAY: ${DIGEST_WEEKDAY:-monday}
      DIGEST_HOUR: ${DIGEST_HOUR:-9}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-America/Sao_Paulo}
      CHANNEL: ${CHANNEL:-whatsapp}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      ALLOWED_NUMBERS: ${ALLOWED_NUMBERS:-}
      OWNER_PHONE: ${OWNER_PHONE:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_ITEM_IDS: ${PLUGGY_ITEM_IDS:-}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      evolution:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 6s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # Dashboard: nginx serve o front e repassa /api ao app (mesma origem, sem CORS).
  # Escuta só em 127.0.0.1; para expor na rede, coloque um proxy com HTTPS na frente (ver README).
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finassist-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  evolution_data:
  redis_data:
